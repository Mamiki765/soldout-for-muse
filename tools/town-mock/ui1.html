<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI案1 横に札</title>
<link rel="stylesheet" href="mock.css">
<style>
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: calc(100vh - var(--hdr, 53px)); }
  .viewport { overflow: auto; position: relative; background: #6f9d55; }
  .viewport .top-map { margin: 24px; }
  aside.side { border-left: 1px solid var(--line); background: var(--bg); overflow: auto; padding: 12px; }
  aside.side h2 { font-size: 13px; color: var(--dim); margin: 4px 0 8px; font-weight: 600; }
  .zoom { position: sticky; left: 12px; top: 12px; z-index: 10; display: inline-flex; flex-direction: column; gap: 4px; float: left; margin: 12px; }
  .zoom button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 18px; cursor: pointer; }
  .tip { position: fixed; pointer-events: none; background: rgba(20,24,33,.92); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; z-index: 30; display: none; max-width: 260px; }
  .grow { margin-top: 10px; }
  .hist { margin-bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .sheet-close { display: none; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; height: calc(100vh - var(--hdr, 92px)); }
    aside.side { position: fixed; left: 0; right: 0; bottom: 0; max-height: 58vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.25); transform: translateY(110%); transition: transform .2s; z-index: 25; }
    aside.side.open { transform: none; }
    .sheet-close { display: inline-block; float: right; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1><a href="index.html">P0</a> ／ UI案1 地図＋横の札</h1>
  <span class="lbl">店数</span><span class="seg" id="seg-shops"><button data-v="121">121</button><button data-v="200">200</button></span>
  <span class="lbl">大通り</span><span class="seg" id="seg-av"><button data-v="2">64px</button><button data-v="1">32px</button></span>
  <span class="lbl">表示</span><span class="seg" id="seg-view"><button data-v="all">全景</button><button data-v="district">地区</button></span>
  <button class="btn primary" id="from-card">許可証の住所を押す</button>
</header>
<div class="layout">
  <div class="viewport" id="vp"><div class="zoom"><button id="zin" title="寄る">＋</button><button id="zout" title="引く">－</button></div></div>
  <aside class="side" id="side">
    <button class="btn sheet-close" id="close">閉じる</button>
    <h2>この案の使い方</h2>
    <p class="note">全景で地区（目印の名前）を選ぶ → 寄ると看板が読める → 店を押すと右（スマホは下）に札が出る。札の「左隣・右隣・向かい」を押すと、その店へ移る。PC はマウスを乗せると店名と住所が出る。</p>
    <p class="note">地図は CSS の仮です。緑の庭のある区画が店（S は小さな家＋庭、M・L は家が大きい）、くすんだ色の家が NPC の家、灰色の札が空き家、黄色の札が休業。</p>
  </aside>
</div>
<div class="tip" id="tip"></div>
<script src="town-gen.js"></script>
<script src="common.js"></script>
<script>
(() => {
  const { T, params, getTown, setParam, shopCard, renderTop, lotInfo } = Mock;
  const p = params();
  const town = getTown(p);
  const vp = document.getElementById('vp'), side = document.getElementById('side'), tip = document.getElementById('tip');
  let view = 'district', scale = 16, selected = null, sizeOverride = null;
  const history = [];
  const mark = (id, v) => document.querySelectorAll('#' + id + ' button').forEach((b) => b.classList.toggle('on', b.dataset.v === String(v)));
  mark('seg-shops', p.shops); mark('seg-av', p.avenue);
  document.getElementById('seg-shops').onclick = (e) => e.target.dataset.v && setParam('shops', e.target.dataset.v);
  document.getElementById('seg-av').onclick = (e) => e.target.dataset.v && setParam('avenue', e.target.dataset.v);
  document.getElementById('seg-view').onclick = (e) => { if (e.target.dataset.v) { view = e.target.dataset.v; scale = view === 'all' ? fitScale() : 16; draw(selected ?? youLot().id); } };
  const youLot = () => town.lots.get(town.shops.get(town.fixture.you).lot);
  const fitScale = () => { const b = T.bounds(town); return Math.max(2, Math.min(16, Math.floor(((vp.clientWidth - 48) / b.w) * 10) / 10)); };

  function draw(focusLot) {
    mark('seg-view', view);
    vp.querySelector('.top-map')?.remove();
    const map = renderTop(town, { scale, highlight: selected, sizeOverride, labels: true });
    if (scale < 9) map.classList.add('show-dlabels');
    vp.appendChild(map);
    if (focusLot) {
      const el = map.querySelector(`[data-lot="${focusLot}"]`);
      if (el) el.scrollIntoView({ block: 'center', inline: 'center' });
    }
  }
  function select(id, push = true) {
    if (push && selected && selected !== id) history.push(selected);
    selected = id;
    sizeOverride = null;
    if (view === 'all') { view = 'district'; scale = 16; }
    draw(id);
    showCard();
  }
  function showCard() {
    const lot = town.lots.get(selected);
    const info = lotInfo(town, lot);
    const canGrow = info.type === 'open' || info.type === 'resting';
    side.innerHTML = `<button class="btn sheet-close" id="close">閉じる</button>
      <div class="hist">${history.length ? `<button class="btn" id="back">← 前の店へ戻る</button>` : ''}<button class="btn" id="home">あなたの店へ</button></div>
      ${shopCard(town, lot)}
      ${canGrow ? `<div class="grow"><span class="lbl note">増築したときの見え方（見本）</span> <span class="seg" id="seg-grow" style="display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden">
        ${['S', 'M', 'L'].map((s) => `<button data-v="${s}" style="border:0;padding:4px 12px;cursor:pointer;background:${(sizeOverride?.size ?? lot.size) === s ? 'var(--accent)' : 'transparent'};color:${(sizeOverride?.size ?? lot.size) === s ? '#fff' : 'var(--ink)'}">${s}</button>`).join('')}</span>
        <p class="note">区画（3×3の敷地）は同じまま、家だけが大きくなる。番地・お隣さんは変わらない。</p></div>` : ''}`;
    side.classList.add('open');
    side.querySelector('#close').onclick = () => side.classList.remove('open');
    side.querySelector('#home').onclick = () => select(youLot().id);
    side.querySelector('#back')?.addEventListener('click', () => select(history.pop(), false));
    side.querySelectorAll('button.go').forEach((b) => (b.onclick = () => select(Number(b.dataset.lot))));
    side.querySelector('#seg-grow')?.addEventListener('click', (e) => {
      if (!e.target.dataset.v) return;
      sizeOverride = { lot: selected, size: e.target.dataset.v };
      draw(); showCard();
    });
  }
  vp.addEventListener('click', (e) => {
    const l = e.target.closest('.lot');
    if (!l) return;
    if (view === 'all') { view = 'district'; scale = 16; draw(Number(l.dataset.lot)); return; }
    select(Number(l.dataset.lot));
  });
  vp.addEventListener('mousemove', (e) => {
    const l = e.target.closest('.lot');
    if (!l || matchMedia('(hover: none)').matches) { tip.style.display = 'none'; return; }
    const lot = town.lots.get(Number(l.dataset.lot));
    const info = lotInfo(town, lot);
    tip.innerHTML = `<b>${Mock.esc(info.title)}</b><br>${Mock.esc(T.addressText(town, lot))}`;
    tip.style.display = 'block';
    tip.style.left = e.clientX + 14 + 'px';
    tip.style.top = e.clientY + 14 + 'px';
  });
  vp.addEventListener('mouseleave', () => (tip.style.display = 'none'));
  document.getElementById('zin').onclick = () => { scale = Math.min(28, scale * 1.4); view = scale < 9 ? 'all' : 'district'; draw(selected); };
  document.getElementById('zout').onclick = () => { scale = Math.max(2, scale / 1.4); view = scale < 9 ? 'all' : 'district'; draw(selected); };
  document.getElementById('from-card').onclick = () => select(youLot().id);
  draw(youLot().id);
})();
</script>
</body>
</html>

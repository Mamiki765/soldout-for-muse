<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案C 案内板</title>
<link rel="stylesheet" href="mock.css">
<style>
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 360px; gap: 12px; padding: 12px 16px; max-width: 1400px; margin: 0 auto; }
  nav.dlist { display: flex; flex-direction: column; gap: 6px; }
  nav.dlist button { text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 8px 10px; cursor: pointer; font: inherit; }
  nav.dlist button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  nav.dlist small { display: block; color: var(--dim); font-size: 11px; }
  .search { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .search input, .search select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  .search input { flex: 1; min-width: 160px; }
  .results { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin-bottom: 10px; font-size: 13px; }
  .results button { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; padding: 2px 0; display: block; text-align: left; }
  .board { background: #3d4a3a; color: #f3efe3; border-radius: 14px; padding: 14px; box-shadow: inset 0 0 0 4px #6b5434, inset 0 0 0 6px #2c241a; }
  .board h2 { margin: 0 0 2px; font-size: 18px; letter-spacing: .1em; }
  .board .lm { font-size: 12px; opacity: .8; margin-bottom: 10px; }
  .st { margin-top: 12px; }
  .st h3 { font-size: 14px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
  .st h3 small { font-weight: 400; opacity: .75; font-size: 11px; }
  .rows { display: grid; grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr); gap: 4px; }
  .rows .road { background: #c9b48a; border-radius: 3px; opacity: .7; }
  .cellb { display: flex; gap: 6px; align-items: center; min-height: 40px; text-align: left; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: inherit; border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 13px; cursor: pointer; }
  .cellb:hover { background: rgba(255,255,255,.14); }
  .cellb.sel { background: #f3efe3; color: #1d2433; }
  .cellb.match { box-shadow: 0 0 0 2px #e9b949; }
  .cellb .no { flex: 0 0 2.4em; font-size: 11px; opacity: .75; text-align: right; }
  .cellb .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cellb .jb { font-size: 10px; opacity: .7; display: block; }
  .cellb .pips { flex: 0 0 auto; display: inline-flex; gap: 2px; }
  .cellb .pips i { width: 7px; height: 7px; border-radius: 2px; background: currentColor; opacity: .25; }
  .cellb .pips i.f { opacity: .9; }
  .cellb.npc, .cellb.pub { opacity: .6; font-style: normal; }
  .cellb.pub { border-style: dashed; }
  .cellb .tag { font-size: 10px; border-radius: 4px; padding: 0 4px; background: #e9b949; color: #3a2a00; }
  .cellb .tag.h { background: #8a8f99; color: #fff; }
  .cellb .tag.n { background: #4f9a5a; color: #fff; }
  .cellb .tag.y { background: #3f6fa0; color: #fff; }
  aside .mini { margin-top: 10px; overflow: auto; border-radius: 10px; border: 1px solid var(--line); }
  aside .mini .top-map .sign { display: none; }
  .back { display: none; margin-bottom: 8px; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 180px minmax(0, 1fr); } aside { grid-column: 1 / -1; } }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav.dlist { flex-direction: row; overflow-x: auto; }
    nav.dlist button { flex: 0 0 auto; }
    body.detail .board-col, body.detail nav.dlist { display: none; }
    body:not(.detail) aside { display: none; }
    .back { display: inline-block; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1><a href="index.html">P0</a> ／ 案C 案内板</h1>
  <span class="lbl">店数</span><span class="seg" id="seg-shops"><button data-v="121">121</button><button data-v="200">200</button></span>
  <button class="btn primary" id="from-card">許可証の住所を押す</button>
</header>
<div class="layout">
  <nav class="dlist" id="dlist"></nav>
  <div class="board-col">
    <div class="search"><input id="q" placeholder="店名・som・番地で探す（例：るり、som9002、噴水通り 3）"><select id="job"><option value="">職業で光らせる</option></select></div>
    <div id="results"></div>
    <div class="board" id="board"></div>
    <p class="note">番地は通りの北側が奇数・南側が偶数。向かいは番地 ±1。□の数が家の大きさ（S・M・L）。</p>
  </div>
  <aside id="side"></aside>
</div>
<script src="town-gen.js"></script>
<script src="common.js"></script>
<script>
(() => {
  const { T, params, getTown, setParam, shopCard, lotInfo, renderTop, esc } = Mock;
  const p = params();
  const town = getTown(p);
  document.querySelectorAll('#seg-shops button').forEach((b) => b.classList.toggle('on', b.dataset.v === String(p.shops)));
  document.getElementById('seg-shops').onclick = (e) => e.target.dataset.v && setParam('shops', e.target.dataset.v);
  const youLot = () => town.lots.get(town.shops.get(town.fixture.you).lot);
  let cur = town.districts[0].id, sel = youLot().id, job = '';
  const jobs = [...new Set([...town.shops.values()].map((s) => s.job).filter(Boolean))].sort();
  document.getElementById('job').innerHTML += jobs.map((j) => `<option>${esc(j)}</option>`).join('');
  document.getElementById('job').onchange = (e) => { job = e.target.value; drawBoard(); };

  function drawList() {
    document.getElementById('dlist').innerHTML = town.districts.map((d) => {
      const n = d.lots.filter((l) => l.kind === 'shop' && l.state === 'occupied').length;
      return `<button data-d="${d.id}" class="${d.id === cur ? 'on' : ''}">${esc(d.name)}<small>${esc(d.landmark.name)} ・ ${n}店</small></button>`;
    }).join('');
    document.querySelectorAll('#dlist button').forEach((b) => (b.onclick = () => { cur = b.dataset.d; drawList(); drawBoard(); }));
  }
  function cell(l) {
    const info = lotInfo(town, l);
    if (l.kind === 'public') return `<button class="cellb pub" data-lot="${l.id}"><span class="no"></span><span class="nm">◆ ${esc(l.publicName)}</span></button>`;
    const pips = ['S', 'M', 'L'].map((s, i) => `<i class="${i <= ['S', 'M', 'L'].indexOf(l.size) ? 'f' : ''}"></i>`).join('');
    const you = info.shop?.som === town.fixture.you;
    const tag = you ? '<span class="tag y">あなた</span>' : info.type === 'resting' ? '<span class="tag">休業</span>' : info.type === 'held' ? '<span class="tag h">空き家</span>' : info.shop?.isNew ? '<span class="tag n">新</span>' : '';
    const m = job && info.shop?.job === job ? ' match' : '';
    if (info.type === 'npc') return `<button class="cellb npc" data-lot="${l.id}"><span class="no">${l.number}</span><span class="nm">NPCの家<span class="jb">空き区画</span></span></button>`;
    return `<button class="cellb ${l.id === sel ? 'sel' : ''}${m}" data-lot="${l.id}"><span class="no">${l.number}</span><span class="nm">${esc(info.type === 'held' ? '（閉店した店）' : info.shop.shop)}<span class="jb">${esc(info.shop.job)}</span></span>${tag}<span class="pips">${info.type === 'held' ? '' : pips}</span></button>`;
  }
  function drawBoard() {
    const d = town.districts.find((x) => x.id === cur);
    let h = `<h2>${esc(d.name)} 案内板</h2><div class="lm">目印：${esc(d.landmark.name)} ・ ${d.strip.kind === 'canal' ? '二本の通りの間は水路' : '二本の通りの間は生け垣'}</div>`;
    for (const ai of [0, 1]) {
      const north = d.lots.filter((l) => l.row === ai * 2), south = d.lots.filter((l) => l.row === ai * 2 + 1);
      h += `<div class="st"><h3>${esc(d.alleys[ai].name)}<small>西 → 東</small></h3><div class="rows">`;
      for (let c = 0; c < T.COLS; c++) h += cell(north[c]) + '<span class="road"></span>' + cell(south[c]);
      h += '</div></div>';
    }
    const board = document.getElementById('board');
    board.innerHTML = h;
    board.querySelectorAll('.cellb').forEach((b) => (b.onclick = () => select(Number(b.dataset.lot))));
  }
  function select(id) {
    sel = id;
    const lot = town.lots.get(id);
    cur = lot.district;
    drawList(); drawBoard();
    const side = document.getElementById('side');
    side.innerHTML = `<button class="btn back" id="back">← 案内板に戻る</button>${shopCard(town, lot)}<div class="mini" id="mini"></div><p class="note">小さな地図は場所の確認用（押しても選べる）。</p>`;
    const d = town.districts.find((x) => x.id === lot.district);
    const map = renderTop(town, { districts: [d], scale: 7, highlight: id, labels: false });
    side.querySelector('#mini').appendChild(map);
    map.onclick = (e) => { const l = e.target.closest('.lot'); if (l) select(Number(l.dataset.lot)); };
    side.querySelectorAll('button.go').forEach((b) => (b.onclick = () => select(Number(b.dataset.lot))));
    side.querySelector('#back').onclick = () => document.body.classList.remove('detail');
    document.body.classList.add('detail');
  }
  document.getElementById('q').oninput = (e) => {
    const q = e.target.value.trim();
    const res = document.getElementById('results');
    if (!q) { res.innerHTML = ''; return; }
    const hits = T.shopLots(town).filter((l) => {
      const s = l.holder && town.shops.get(l.holder);
      const txt = `${s?.shop ?? ''} ${s?.som ?? ''} ${T.addressText(town, l)}`;
      return q.split(/\s+/).every((w) => txt.includes(w));
    }).slice(0, 12);
    res.innerHTML = `<div class="results">${hits.length ? hits.map((l) => `<button data-lot="${l.id}">${esc(town.shops.get(l.holder)?.shop ?? 'NPCの家')} ・ ${esc(T.addressText(town, l))}</button>`).join('') : '見つかりません'}</div>`;
    res.querySelectorAll('button').forEach((b) => (b.onclick = () => select(Number(b.dataset.lot))));
  };
  document.getElementById('from-card').onclick = () => select(youLot().id);
  drawList(); drawBoard(); select(sel);
  document.body.classList.remove('detail');
})();
</script>
</body>
</html>

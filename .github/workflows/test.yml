# SOLD OUT for Muse — テスト (npm test) を GitHub で回す。
# 回しすぎてアカウントが止められないよう、**手で押したときだけ** 走る (push・PR では走らない)。
# 押し方: GitHub の Actions タブ → test → Run workflow
# 止め方: Actions タブ → test → 右上の「…」→ Disable workflow (またはこのファイルを消す)
# 代わり: 手元で npm test (Linux で数秒)。Forgejo Actions でもこのファイルをそのまま使える。
name: test
on:
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
